<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wollwölklein vom Berg</title>
  <meta property="og:title" content="Wollwölklein vom Berg">
  <meta name="application-name" content="Wollwölklein vom Berg">
  <meta name="description" content="Wollwölklein vom Berg. Cursor oder Finger über die Wolle bewegen.">
  <link rel="icon" href="assets/icons/sheep.svg?v=20261107f" type="image/svg+xml">
  <link rel="stylesheet" href="css/site.css?v=20261107f">
</head>
<body>
  <main class="page">
    <p class="kicker">Durchleuchtung</p>
    <div class="layout">
      <div class="name">
        <h1>
          <span>Wollwölklein</span>
          <span>vom Berg</span>
        </h1>
      </div>
      <div class="scan" id="scan">
        <img class="layer" src="assets/sheep-normal.png?v=116eeb948f4f6912" alt="Wollwölklein vom Berg" width="1600" height="2000">
        <div class="mask" id="mask">
          <img class="layer" src="assets/sheep-xray.png?v=e95f98ae25bf440f" alt="" width="1600" height="2000">
        </div>
        <div class="lens" id="lens" hidden>
          <span class="lens-dot"></span>
        </div>
      </div>
    </div>
    <p class="hint">
      <span class="hint-fine">Cursor über die Wolle bewegen</span>
      <span class="hint-coarse">Zum Durchleuchten ziehen</span>
    </p>
    <div class="end" aria-hidden="true"><span class="chevron"></span></div>
  </main>
  <script src="js/scan.js?v=20261107f"></script>
</body>
</html>
